    - data:
        code: "function main({ scriptText }) {\n  const text = String(scriptText ||\
          \ \"\").trim();\n  \n  const promptMatch = text.match(/PROMPT:\\s*([^\\\
          n\\r]+(?:\\n(?!\\s*(?:Negative Prompt:|Thông số:|$))[^\\n\\r]+)*)/i)\n \
          \                  || text.match(/Prompt điều khiển Video AI[^:]*:\\s*([^\\\
          n\\r]+)/i)\n                   || text.match(/PROMPT\\s*(?:VIDEO|AI)?:\\\
          s*([\\s\\S]*?)(?:\\n\\s*Negative|\\n\\s*Scene|\\n\\s*Thông số|$)/i);\n \
          \ \n  let prompt = promptMatch ? promptMatch[1].trim() : \"\";\n  prompt\
          \ = prompt.replace(/^\\[|\\]$/g, '').replace(/^\"|\"$/g, '').replace(/^\\\
          *\\*|\\*\\*$/g, '').trim();\n  \n  if (!prompt || prompt.length < 15) {\n\
          \    prompt = \"Cinematic slow motion commercial shot of steaming King Coffee\
          \ being poured into a luxury glass cup, fresh coffee beans rolling, golden\
          \ morning sunlight, 4k ultra-realistic\";\n  }\n  \n  const negative_prompt\
          \ = \"blurry, low quality, distorted, extra limbs, watermark, artifacts,\
          \ bad typography, morphing, jerky movement\";\n  \n  return {\n    prompt,\n\
          \    negative_prompt\n  };\n}"
        code_language: javascript
        outputs:
          negative_prompt:
            children: null
            type: string
          prompt:
            children: null
            type: string
        selected: false

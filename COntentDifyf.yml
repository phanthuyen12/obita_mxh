    - data:
        code: "function main({ scriptText, imageProduct, imageUrl, characterName,\
          \ characterDna, characterAvatar, voiceoverText, voice, actionPrompt, userPrompt,\
          \ inputDuration, inputAspectRatio }) {\n  const text = String(scriptText\
          \ || \"\").trim();\n  \n  // 1. Resolve Image URL & Mode (i2v vs t2v)\n\
          \  let resolvedImgUrl = String(imageProduct || imageUrl || \"\").trim();\n\
          \  const charAvatar = String(characterAvatar || \"\").trim();\n  if (!resolvedImgUrl\
          \ && charAvatar) {\n    resolvedImgUrl = charAvatar;\n  }\n  const mode\
          \ = resolvedImgUrl ? \"i2v\" : \"t2v\";\n\n  // 2. Parse base prompt from\
          \ LLM script if present\n  const promptMatch = text.match(/PROMPT:\\s*([^\\\
          n\\r]+(?:\\n(?!\\s*(?:Negative Prompt:|Thông số:|$))[^\\n\\r]+)*)/i)\n \
          \                  || text.match(/Prompt điều khiển Video AI[^:]*:\\s*([^\\\
          n\\r]+)/i)\n                   || text.match(/PROMPT\\s*(?:VIDEO|AI)?:\\\
          s*([\\s\\S]*?)(?:\\n\\s*Negative|\\n\\s*Scene|\\n\\s*Thông số|$)/i);\n \
          \ \n  let llmPrompt = promptMatch ? promptMatch[1].trim() : \"\";\n  llmPrompt\
          \ = llmPrompt.replace(/^\\[|\\]$/g, \"\").replace(/^\"|\"$/g, \"\").replace(/^\\\
          *\\*|\\*\\*$/g, \"\").trim();\n\n  // 3. Assemble prompt components to enforce\
          \ Product, Character DNA, and Spoken Lip-sync\n  const parts = [];\n\n \
          \ // Product Constraint (Mandatory for preserving product identity)\n  if\
          \ (resolvedImgUrl && resolvedImgUrl !== charAvatar) {\n    parts.push(\"\
          STRICT PRODUCT PRESERVATION: Maintain 100% exact appearance, packaging,\
          \ bottle, label, logo, and colors from the reference product image. The\
          \ original product remains completely sharp and intact at the focal center\
          \ without any morphing or modification.\");\n  }\n\n  // Consistent Character\
          \ DNA & Reference Face\n  if (characterName || characterDna || charAvatar)\
          \ {\n    const charDesc = [characterName, characterDna].filter(Boolean).join(\"\
          : \");\n    let charPrompt = `CONSISTENT CHARACTER: Featuring ${charDesc\
          \ || \"King Coffee Brand Ambassador\"}. Retain 100% identical facial features,\
          \ hair, clothing, and natural friendly commercial appearance.`;\n    if\
          \ (charAvatar && charAvatar !== resolvedImgUrl) {\n      charPrompt += `\
          \ Facial reference: ${charAvatar}.`;\n    }\n    parts.push(charPrompt);\n\
          \  }\n\n  // Spoken Dialogue & Lip Sync\n  if (voiceoverText && String(voiceoverText).trim().length\
          \ > 0) {\n    parts.push(`SPOKEN DIALOGUE & LIP-SYNC: The character speaks\
          \ the following lines aloud in Vietnamese with natural synchronized mouth\
          \ movement and facial emotion: \\\"${String(voiceoverText).trim()}\\\".`);\n\
          \  }\n\n  // Camera Motion & Scene\n  if (actionPrompt && actionPrompt.trim())\
          \ {\n    parts.push(`CAMERA MOVEMENT: ${actionPrompt.trim()}`);\n  } else\
          \ if (llmPrompt && llmPrompt.length > 20) {\n    parts.push(llmPrompt);\n\
          \  } else if (userPrompt && userPrompt.trim()) {\n    parts.push(`SCENE:\
          \ ${userPrompt.trim()}`);\n  } else {\n    parts.push(\"Cinematic smooth\
          \ slow push-in shot, premium coffee atmosphere, soft commercial lighting,\
          \ 4K resolution ultra-realistic.\");\n  }\n\n  const prompt = parts.join(\"\
          \ \");\n\n  const negative_prompt = \"distorted product, deformed packaging,\
          \ altered logo, fake brand, mutating cup, changing label, blurry, low quality,\
          \ artifacts, extra limbs, bad eyes, cartoonish modification, wrong product,\
          \ glitch, flickering\";\n\n  // Duration mapping for RevidAPI (valid durations are strictly: 6, 10, 15)\n  let duration = \"6\";\n  if (inputDuration) {\n    const num = parseInt(String(inputDuration).replace(/\\D/g, \"\"), 10);\n    if (num > 12) {\n      duration = \"15\";\n    } else if (num >= 8) {\n      duration = \"10\";\n    } else {\n      duration = \"6\";\n    }\n  }\n\n  // Aspect ratio\n  let aspect_ratio = inputAspectRatio\
          \ || \"9:16\";\n  if (![\"9:16\", \"16:9\", \"1:1\"].includes(aspect_ratio))\
          \ {\n    aspect_ratio = \"9:16\";\n  }\n\n  return {\n    prompt,\n    negative_prompt,\n\
          \    img_url: resolvedImgUrl,\n    character_avatar: charAvatar,\n    mode,\n\
          \    duration,\n    aspect_ratio,\n    voiceover_text: String(voiceoverText\
          \ || \"\").trim(),\n    voice: String(voice || \"vi_vn_female_warm\").trim()\n\
          \  };\n}"
        code_language: javascript

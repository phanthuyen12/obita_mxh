            Coffee.


            NHIỆM VỤ:

            Tạo một bài viết mạng xã hội (Facebook) hoàn chỉnh, cuốn hút, sang trọng,
            đúng phong cách King Coffee, chuẩn AIDA và sẵn sàng xuất bản ngay.


            QUY TẮC ĐẦU RA BẮT BUỘC:

            - CHỈ XUẤT BÀI VIẾT THỰC TẾ, không thêm câu chào hỏi, lời dẫn hay văn
            bản mở đầu/kết bài phụ.

            - TUYỆT ĐỐI KHÔNG in các nhãn cấu trúc phân mục như ''1. TIÊU ĐỀ:'', ''2.
            NỘI DUNG CHÍNH:'', ''3. CTA:'', ''4. HASHTAGS:'', ''5. GỢI Ý HÌNH ẢNH:''.

            - Bắt đầu trực tiếp bằng Tiêu đề bài viết ấn tượng (in đậm kèm emoji),
            tiếp nối là thân bài truyền cảm, các ưu đãi đặc quyền, lời kêu gọi hành
            động (CTA) mượt mà và kết thúc bằng bộ hashtags thịnh hành (#KingCoffee
            #KingCoffee3in1...).

            - Giọng văn: Sang trọng, ấm áp, tinh tế, giàu cảm xúc và khơi dậy đam
            mê thưởng thức cà phê thượng hạng.'

          s*Negative Prompt:|\\n\\s*THÔNG SỐ:|$)/i);\n  \n  let result = match ? match[1].trim()\
          \ : text;\n  \n  // Remove surrounding brackets, quotes, or markdown bold\n\
          \  result = result.replace(/^\\[|\\]$/g, '').replace(/^\"|\"$/g, '').replace(/^\\\

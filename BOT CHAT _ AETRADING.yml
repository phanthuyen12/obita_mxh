app:
  description: Bot tư vấn và chăm sóc khách hàng AETrading - gọi trực tiếp Claude API qua hhtechapi.com
  icon: 📈
  icon_background: '#1A3A5C'
  icon_type: emoji
  mode: advanced-chat
  name: BOT CHAT | AETRADING
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: API Key để gọi Claude qua hhtechapi.com
    id: env-anthropic-key
    name: ANTHROPIC_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 'Xin chào! Tôi là trợ lý AI của AETrading. Bạn cần hỗ trợ gì ạ?'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - Tôi muốn tìm hiểu về sản phẩm
    - Chính sách giao dịch như thế nào?
    - Làm thế nào để đặt hàng?
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-call_claude-target
      selected: false
      source: start
      sourceHandle: source
      target: call_claude
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: call_claude-source-extract_reply-target
      selected: false
      source: call_claude
      sourceHandle: source
      target: extract_reply
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
      id: extract_reply-source-final_answer-target
      selected: false
      source: extract_reply
      sourceHandle: source
      target: final_answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: User Input
        type: start
        variables:
        - hide: false
          hint: ''
          label: persona
          max_length: 5000
          options: []
          placeholder: Tùy chỉnh Persona và kịch bản cho Bot AETrading...
          required: false
          type: paragraph
          variable: persona
        - hide: false
          hint: ''
          label: knowledge_base
          max_length: 5000
          options: []
          placeholder: Thông tin sản phẩm / Kiến thức nghiệp vụ AETrading...
          required: false
          type: paragraph
          variable: knowledge_base
      height: 135
      id: start
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        selected: false
        title: Gọi Claude API (hhtechapi)
        type: http-request
        method: post
        url: https://hhtechapi.com/v1/messages
        headers: "Authorization: Bearer {{#env.ANTHROPIC_API_KEY#}}\nanthropic-version:\
          \ 2023-06-01\nContent-Type: application/json"
        body:
          type: json
          data: "{\n  \"model\": \"claude-sonnet-4-5\",\n  \"max_tokens\": 1024,\n\
            \  \"system\": \"Bạn là nhân viên tư vấn và chăm sóc khách hàng chuyên\
            \ nghiệp của AETrading.\\n\\n{{#start.persona#}}\\n\\n{{#start.knowledge_base#}}\\\
            n\\nQUY TẮC TƯ VẤN:\\n1. Luôn trả lời bằng tiếng Việt, thân thiện, lịch\
            \ sự và ngắn gọn (không quá 3 đoạn văn).\\n2. Chỉ sử dụng thông tin\
            \ trong Knowledge Base để tư vấn. Không bịa đặt thông tin về sản phẩm,\
            \ giá cả, chính sách.\\n3. Khi không có thông tin: \\\"Dạ, câu hỏi này\
            \ cần tư vấn chuyên sâu hơn. Em sẽ chuyển đến chuyên viên AETrading\
            \ hỗ trợ ngay ạ.\\\"\\n4. Ghi nhớ lịch sử hội thoại để không hỏi lại\
            \ thông tin khách đã cung cấp.\",\n  \"messages\": [{\"role\": \"user\"\
            , \"content\": \"{{#sys.query#}}\"}]\n}"
        timeout:
          connect: 15
          read: 120
          write: 20
        retry:
          enabled: true
          max_retries: 2
          retry_interval: 1000
        output_variables:
        - variable: body
          value_selector: []
        - variable: status_code
          value_selector: []
      height: 104
      id: call_claude
      position:
        x: 330
        y: 200
      positionAbsolute:
        x: 330
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        selected: false
        title: Lấy nội dung phản hồi
        type: code
        code_language: python3
        code: "import json\n\ndef main(body: str) -> dict:\n    try:\n        data\
          \ = json.loads(body)\n        # Anthropic response: {\"content\": [{\"type\"\
          : \"text\", \"text\": \"...\"}]}\n        content = data.get(\"content\"\
          , [])\n        if content and isinstance(content, list):\n            text\
          \ = content[0].get(\"text\", \"\")\n            if text:\n                return\
          \ {\"reply\": text}\n        # Fallback: try error message\n        error\
          \ = data.get(\"error\", {}).get(\"message\", \"\")\n        if error:\n\
          \            return {\"reply\": f\"Xin lỗi, có lỗi xảy ra: {error}\"}\n\
          \        return {\"reply\": \"Xin lỗi, không nhận được phản hồi từ AI.\"\
          }\n    except Exception as e:\n        return {\"reply\": f\"Lỗi xử lý\
          \ phản hồi: {str(e)}\"}\n"
        inputs:
          body:
            required: true
            type: string
            value_selector:
            - call_claude
            - body
        outputs:
        - name: reply
          type: string
      height: 54
      id: extract_reply
      position:
        x: 630
        y: 200
      positionAbsolute:
        x: 630
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        answer: '{{#extract_reply.reply#}}'
        desc: ''
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 102
      id: final_answer
      position:
        x: 930
        y: 200
      positionAbsolute:
        x: 930
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: 0
      y: 100
      zoom: 0.85
  rag_pipeline_variables: []

services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: dev
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: trypost-app:dev
        ports:
            - '${APP_PORT:-8000}:80'
            - '${REVERB_PORT:-8080}:8080'
            - '${VITE_PORT:-5173}:5173'
        environment:
            TRYPOST_DOCKER_BOOTSTRAP: '1'
            UID: ${UID:-1000}
            GID: ${GID:-1000}
            # Real env vars take precedence over .env.testing. Without these,
            # the test suite can't see MySQL / Redis from inside the container.
            DB_HOST: mysql
            DB_CONNECTION: mysql
            DB_PORT: 3306
            DB_DATABASE: trypost
            DB_USERNAME: trypost
            DB_PASSWORD: password
            REDIS_HOST: redis
        volumes:
            - .:/var/www/html
            - app-vendor:/var/www/html/vendor
            - app-node-modules:/var/www/html/node_modules
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 90s

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-trypost}
            MYSQL_USER: ${DB_USERNAME:-trypost}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
        volumes:
            - mysqldata:/var/lib/mysql
            - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME:-trypost} -p${DB_PASSWORD:-password} --silent']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redisdata:/data
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_UI_PORT:-8025}:8025'

volumes:
    mysqldata:
    redisdata:
    app-vendor:
    app-node-modules:

    - data:
        classes:
        - id: '1'
          label: KHOBAU
          name: 'Khach comment/inbox "KHO BAU"

            Khach muon nhan ebook

            Khach hoi tai lieu ve tu duy, tam ly giao dich

            FOMO, chua co phuong phap, minh muon xem ebook

            Cac cau tra loi tiep noi: co, gui minh nhe, minh hay FOMO'
        - id: '2'
          label: SMC
          name: 'Khach hoi ve SMC

            Khach hoi Smart Money Concept

            Khach binh luan "30 Chien Luoc"

            Khach hoi vi sao hay bi quet Stoploss

            Khach hoi phuong phap giao dich

            Cac cau tra loi tiep noi: forex, crypto, gold, da co phuong phap'
        - id: '1782828300001'
          label: SMC_SACH
          name: 'Khach hoi GIA bo sach SMC

            Khach hoi uu dai, giam gia, chuyen khoan truoc bo sach SMC

            Khach hoi muc luc, noi dung, so tap bo sach SMC

            Khach muon MUA bo sach SMC'
        - id: '1782826927144'
          label: BẢN ĐỒ
          name: 'Khach comment/inbox "BAN DO"

            Khach hoi lo trinh hoc

            Khach hoi nen hoc tu dau, nguoi moi bat dau

            Cac cau tra loi tiep noi: level 0, level 1, level 2, level 3, level 4'
        - id: '1782826927944'
          label: FIN_AI_INFO
          name: 'Khach hoi Fin AI la gi

            Khach hoi cong cu Scalping hoat dong the nao

            Khach hoi AI bao lenh ra sao

            Khach hoi Fin AI co tot khong, co dang dung khong'
        - id: '1782828300002'
          label: FIN_AI_DK
          name: 'Khach muon dang ky Fin AI

            Khach xin link dang ky Fin AI

            Khach noi "gui minh link dang ky", "minh muon dung thu"

            Khach hoi sau khi dang ky thi lam gi'
        - id: '1782828300003'
          label: KHAIGIANG
          name: 'Khach hoi lich khai giang

            Khach hoi lich hoc, thoi gian hoc, hoc may buoi

            Khach hoi hinh thuc hoc online/offline, hoc qua Zoom

            Khach hoi dang ky giu cho'
        - id: '1782827029001'
          label: HOC_PHI
          name: 'Khach hoi hoc phi, gia khoa hoc

            Khach hoi nap tien, thanh toan bang cach nao

            Khach hoi co uu dai, giam gia, hoc bong khong

            Khach hoi chinh sach hoan tien'
        - id: '1782828300004'
          label: THI_CU
          name: 'Khach hoi thi cu, thi quy

            Khach hoi pass quy, thi tuyen, vuot quy

            Khach hoi tai khoan quy, dieu kien duoc cap tai khoan quy

            Khach hoi quy trinh thi, bai thi gom gi'
        - id: '1782828300005'
          label: RANK
          name: 'Khach hoi Rank la gi

            Khach hoi su khac nhau giua BASIC, PLUS, VIP

            Khach hoi lam sao de len Rank

            Khach hoi Rank cua minh dang o dau

            Khach muon nang cap Rank'
        - id: '1782828300006'
          label: CHAO_HOI
          name: 'Khach chi gui loi chao: hi, hello, xin chao, chao ban

            Tin nhan dau tien chua ro nhu cau

            Khach gui vai tu chua du thong tin de phan loai'
        - id: '1782828300007'
          label: HANDOFF
          name: 'Khach hoi ngoai pham vi 4 pheu chinh

            Khach muon gap nguoi that, hoi admin

            Khach hoi ky thuat tai khoan, loi dang nhap

            Cau hoi phuc tap bot khong du thong tin de tra loi'
